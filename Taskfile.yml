version: "3"

run: when_changed

# https://taskfile.dev/
# go install github.com/go-task/task/v3/cmd/task@latest

vars:
  ENV:
    sh: echo "${ENV:-local}"

dotenv: [".env.{{.ENV}}", ".env"]

tasks:
  docker:aws:
    required: [PROFILE]
    cmds:
      - |
        # Export resolved credentials, then pass them into Docker
        eval $(aws configure export-credentials --profile {{.PROFILE}} --format env)
        docker run --rm -t -v $(pwd):/former2 \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -e AWS_SESSION_TOKEN \
          -e AWS_REGION=ap-southeast-2 \
          former2:latest generate \
          --output-raw-data "tmp/{{.PROFILE}}.json" \
          --region ap-southeast-2 \
          --sort-output \
          --debug
  docker:build:
    cmds:
      - docker build -f cli/Dockerfile -t former2:latest .
  